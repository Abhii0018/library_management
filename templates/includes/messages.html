{% if messages %}
<div class="alert-container">
  {% for message in messages %}
    <div class="alert alert-{{ message.tags|default:'info' }}" role="alert">
      <span>{{ message }}</span>
      <button type="button" class="alert-close" aria-label="Close">&times;</button>
    </div>
  {% endfor %}
</div>
{% endif %}
